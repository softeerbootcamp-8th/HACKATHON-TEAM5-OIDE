name: Frontend CI

on:
  # CD 워크플로(frontend-deploy.yml)가 이 CI를 workflow_call로 호출한다.
  # backend-ci.yml과 같은 이유로, CD가 CI를 호출해 통과를 기다린 뒤에만 배포하도록 연결한다.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 테스트 스크립트가 아직 package.json에 없어 제외한다.
      # 추가되면 여기에 `pnpm test` 스텝을 넣는다.

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
