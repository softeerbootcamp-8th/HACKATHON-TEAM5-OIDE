name: Deploy frontend to S3

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  contents: read

concurrency:
  group: frontend-production
  # S3 동기화 도중 취소되면 일부 파일만 배포될 수 있으므로 진행 중인 배포를 중단하지 않는다.
  cancel-in-progress: false

env:
  S3_BUCKET: oide-s3-699155485641-ap-northeast-2-an
  S3_PREFIX: dist
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Validate deployment configuration
        run: |
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "Repository variable CLOUDFRONT_DISTRIBUTION_ID is required."
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: ./dist

      - name: Sync hashed assets (long-lived cache)
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${S3_PREFIX}" \
            --delete \
            --exclude "*" --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync remaining files (no-cache, so index.html always picks up the latest asset hashes)
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${S3_PREFIX}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
