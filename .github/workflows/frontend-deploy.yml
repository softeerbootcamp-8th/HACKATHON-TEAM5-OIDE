name: Deploy frontend to S3

on:
  push:
    # TODO(#109): dev는 팀원 확인 편의를 위한 임시 배포 트리거다. main만 남기고 원복할 것.
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  contents: read

concurrency:
  group: frontend-production
  # S3 동기화 도중 취소되면 일부 파일만 배포될 수 있으므로 진행 중인 배포를 중단하지 않는다.
  cancel-in-progress: false

env:
  S3_BUCKET: oide-s3-699155485641-ap-northeast-2-an
  S3_PREFIX: dist

jobs:
  ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: ./dist

      - name: Sync hashed assets (long-lived cache)
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${S3_PREFIX}" \
            --delete \
            --exclude "*" --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync remaining files (no-cache, so index.html always picks up the latest asset hashes)
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${S3_PREFIX}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"
