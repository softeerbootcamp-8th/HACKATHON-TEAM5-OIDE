spring:
  application:
    name: oide
  profiles:
    default: local
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
    open-in-view: false

  servlet:
    multipart:
      # FR-02: 스크린샷 20장을 한 번에 올린다. 장당 크기 제한의 유일한 기준이며,
      # 초과분은 컨테이너가 본문을 다 읽기 전에 거절한다.
      max-file-size: 10MB
      max-request-size: 200MB

exim:
  base-url: ${EXIM_BASE_URL:https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON}
  api-key: ${EXIM_API_KEY:}

# --- 공개 접근 도메인 ---
# CloudFront가 EC2로 요청을 넘길 때 http로 전달하기 때문에, springdoc이 자동 추론하는
# OpenAPI 서버 URL이 http로 잡혀 Swagger UI의 Try it out이 mixed content로 막힌다.
# 그래서 실제 공개 도메인을 명시적으로 고정한다(OpenApiConfig 참고). 로컬은 비워서 자동 추론에 맡긴다.
app:
  public-base-url: https://d3bma9vfe5xm5p.cloudfront.net

oide:
  gemini:
    # 서버 환경변수로 주입한다. 비어 있으면 GeminiConfig가 기동을 중단한다.
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    # 스크린샷의 작은 회색 글씨(시각, 잔액)를 읽어야 해서 HIGH에서 시작한다.
    # 장당 1120토큰이며, 골든 데이터셋 정확도를 보고 MEDIUM(560토큰)까지 낮춰본다.
    media-resolution: MEDIA_RESOLUTION_HIGH
    # 이 작업에는 추론이 필요 없다. flash-lite 기본값과 같지만 의존하지 않고 명시한다.
    thinking-level: minimal
    timeout: 60s
    max-retries: 2
